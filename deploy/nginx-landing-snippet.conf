# Paste inside the presstropic.com server block (inside server { ... }).

# Hides the mockups and all other non-page assets from search engines.
location ^~ /assets/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri =404;
}

# Never serve deployment files, source or config files publicly.
location ^~ /deploy/ { return 404; }
location ~* \.(py|md|sh|env|git|conf)$ { return 404; }
